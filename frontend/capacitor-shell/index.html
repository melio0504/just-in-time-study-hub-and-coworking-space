<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just In Time Study Hub</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #fffcf7;
        color: #2d2520;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 30rem);
        border: 1px solid #f3ede4;
        border-radius: 1.5rem;
        background: white;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 1rem 3rem rgb(45 37 32 / 10%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: #6b5e52;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Just In Time Study Hub</h1>
      <p>The app could not connect to the website. Check your connection and try again.</p>
    </main>
  </body>
</html>
